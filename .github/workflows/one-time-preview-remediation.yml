name: One-time INSPIRATH preview remediation
on:
  push:
    branches:
      - integration/main-participant-remediation
    paths:
      - package.json
permissions:
  contents: write
jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: integration/main-participant-remediation
          token: ${{ github.token }}
      - name: Configure Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply source compatibility and security fixes
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function replaceOnce(file, before, after, label) {
            const current = fs.readFileSync(file, 'utf8');
            if (!current.includes(before)) {
              if (current.includes(after)) return;
              throw new Error('Expected source pattern not found: ' + label + ' in ' + file);
            }
            fs.writeFileSync(file, current.replace(before, after));
          }

          fs.writeFileSync('.nvmrc', '24' + String.fromCharCode(10));
          replaceOnce(
            'README.md',
            'Uses Node.js `22.x` as declared in `package.json` (`engines`) and `.nvmrc`.',
            'Uses Node.js `24.x` as declared in `package.json` (`engines`), `.nvmrc`, and the linked Vercel project.',
            'Node runtime documentation'
          );

          replaceOnce(
            'scripts/seedJudgeAccessCode.ts',
            "import * as admin from 'firebase-admin';",
            "import { cert, initializeApp } from 'firebase-admin/app';\nimport { getFirestore } from 'firebase-admin/firestore';",
            'seedJudgeAccessCode imports'
          );
          replaceOnce(
            'scripts/seedJudgeAccessCode.ts',
            "admin.initializeApp({ projectId: 'demo-sahithyolsav-2025' }, 'emu-seed-jry')",
            "initializeApp({ projectId: 'demo-sahithyolsav-2025' }, 'emu-seed-jry')",
            'emulator initialization'
          );
          replaceOnce('scripts/seedJudgeAccessCode.ts', 'emuApp.firestore()', 'getFirestore(emuApp)', 'emulator Firestore');
          replaceOnce(
            'scripts/seedJudgeAccessCode.ts',
            "admin.initializeApp({ credential: admin.credential.cert(serviceAccount), projectId: 'inspirath-d6778' }, 'prod-seed-jry')",
            "initializeApp({ credential: cert(serviceAccount), projectId: 'inspirath-d6778' }, 'prod-seed-jry')",
            'production seed initialization'
          );
          replaceOnce('scripts/seedJudgeAccessCode.ts', 'prodApp.firestore()', 'getFirestore(prodApp)', 'production Firestore');

          replaceOnce(
            'scripts/seedProduction.ts',
            "import * as admin from 'firebase-admin';",
            "import { cert, getApps, initializeApp } from 'firebase-admin/app';\nimport { getFirestore } from 'firebase-admin/firestore';",
            'seedProduction imports'
          );
          replaceOnce(
            'scripts/seedProduction.ts',
            "admin.apps.find(a => a?.name === 'prod-seed') || admin.initializeApp({",
            "getApps().find(a => a.name === 'prod-seed') || initializeApp({",
            'seedProduction initialization'
          );
          replaceOnce('scripts/seedProduction.ts', 'admin.credential.cert(serviceAccount)', 'cert(serviceAccount)', 'seedProduction credentials');
          replaceOnce('scripts/seedProduction.ts', 'app.firestore()', 'getFirestore(app)', 'seedProduction Firestore');

          const staleBefore = [
            '    beforeAll(async () => {',
            '      // Seed competition for stale mapping test',
            "      await db.collection('competitions').doc(staleCompId).set({"
          ].join(String.fromCharCode(10));
          const staleAfter = [
            '    beforeAll(async () => {',
            '      // This suite uses fixed emulator document IDs. Remove artifacts from prior',
            '      // runs first so the code-letter allocator always begins with a clean A/B pool.',
            '      await Promise.all([',
            "        db.collection('greenRoomAssignments').doc(staleCompId + '_reg-stale-1').delete(),",
            "        db.collection('greenRoomAssignments').doc(staleCompId + '_reg-stale-2').delete(),",
            "        db.collection('greenRoomCounters').doc(staleCompId).delete(),",
            "        db.collection('competitionMarkingLocks').doc(staleCompId).delete(),",
            "        db.collection('markEntries').doc('me-' + staleJudgeAssignId).delete(),",
            "        db.collection('registrations').doc('reg-stale-1').delete(),",
            "        db.collection('registrations').doc('reg-stale-2').delete(),",
            "        db.collection('judgeAssignments').doc(staleJudgeAssignId).delete(),",
            "        db.collection('competitions').doc(staleCompId).delete(),",
            '      ]);',
            '',
            '      // Seed competition for stale mapping test',
            "      await db.collection('competitions').doc(staleCompId).set({"
          ].join(String.fromCharCode(10));
          replaceOnce('src/__tests__/greenRoomOperations.test.ts', staleBefore, staleAfter, 'stale Green Room fixture cleanup');

          replaceOnce(
            'src/components/domain/FestivalSettingsModal.tsx',
            "import { auth } from '@/lib/firebase/client';",
            "import { auth, storage } from '@/lib/firebase/client';\nimport { getDownloadURL, ref, uploadBytes } from 'firebase/storage';",
            'festival logo storage imports'
          );
          const logoBefore = [
            '      if (logoFile) {',
            "        if (!auth?.currentUser) throw new Error('Sign in as Chief Administrator to upload the logo.');",
            '        const token = await auth.currentUser.getIdToken(true);',
            "        const response = await fetch('/api/admin/festival-logo', {",
            "          method: 'POST',",
            "          headers: { Authorization: 'Bearer ' + token, 'Content-Type': logoFile.type },",
            '          body: logoFile',
            '        });',
            '        const data = await response.json();',
            "        if (!response.ok || !data.url) throw new Error(data.error || 'Could not upload festival logo.');",
            '        changes.logoUrl = data.url;',
            '      }'
          ].join(String.fromCharCode(10));
          const logoAfter = [
            '      if (logoFile) {',
            "        if (!auth?.currentUser) throw new Error('Sign in as Chief Administrator to upload the logo.');",
            "        if (!storage) throw new Error('Firebase Storage is not configured for this environment.');",
            '        const extensionByType: Record<string, string> = {',
            "          'image/png': 'png', 'image/jpeg': 'jpg', 'image/webp': 'webp',",
            '        };',
            '        const extension = extensionByType[logoFile.type];',
            '        if (!extension || logoFile.size === 0 || logoFile.size >= 5 * 1024 * 1024) {',
            "          throw new Error('Upload a nonempty PNG, JPG or WebP image smaller than 5 MB.');",
            '        }',
            '        const signature = new Uint8Array(await logoFile.slice(0, 12).arrayBuffer());',
            '        const isPng = signature.length >= 8 && [137, 80, 78, 71, 13, 10, 26, 10].every((v, i) => signature[i] === v);',
            '        const isJpeg = signature.length >= 3 && signature[0] === 0xff && signature[1] === 0xd8 && signature[2] === 0xff;',
            '        const isWebp = signature.length >= 12 && String.fromCharCode(...signature.slice(0, 4)) === \'RIFF\' && String.fromCharCode(...signature.slice(8, 12)) === \'WEBP\';',
            '        if (!(logoFile.type === \'image/png\' && isPng || logoFile.type === \'image/jpeg\' && isJpeg || logoFile.type === \'image/webp\' && isWebp)) {',
            "          throw new Error('Selected file content does not match its image type.');",
            '        }',
            '        // Storage Rules enforce the signed-in ADMIN role; WIF remains Firestore-only.',
            "        const logoRef = ref(storage, 'branding/festival-logo-' + crypto.randomUUID() + '.' + extension);",
            '        const uploaded = await uploadBytes(logoRef, logoFile, {',
            '          contentType: logoFile.type,',
            '          customMetadata: { uploadedBy: auth.currentUser.uid },',
            '        });',
            '        changes.logoUrl = await getDownloadURL(uploaded.ref);',
            '      }'
          ].join(String.fromCharCode(10));
          replaceOnce('src/components/domain/FestivalSettingsModal.tsx', logoBefore, logoAfter, 'secure festival logo upload');

          replaceOnce(
            'docs/WORKLOAD_IDENTITY_STAGING.md',
            '- **Firebase Authentication Admin (`roles/firebaseauth.admin`)**: **NOT NEEDED / OMITTED**.',
            '- **Cloud Storage object roles (`roles/storage.objectAdmin` / `roles/storage.objectCreator`)**: **NOT NEEDED / OMITTED**. Festival logo uploads use the signed-in Chief Admin Firebase Client SDK and the `branding/` Firebase Storage Rules, which enforce the active ADMIN claim and authoritative `/users/{uid}` role. The staging WIF service account receives no direct bucket-write access. `/api/festival/logo` only reads public theme data and serves the configured public image for exports.\n- **Firebase Authentication Admin (`roles/firebaseauth.admin`)**: **NOT NEEDED / OMITTED**.',
            'WIF least privilege documentation'
          );

          fs.rmSync('src/app/api/admin/festival-logo/route.ts', { force: true });
          NODE
      - name: Refresh dependency lockfile
        run: npm install
      - name: Verify clean dependency install
        run: npm ci
      - name: TypeScript and lint
        run: |
          npx tsc --noEmit
          npm run lint
      - name: Run seeded Firebase emulator regression suite
        run: |
          npx firebase emulators:exec --only auth,firestore,storage --project demo-sahithyolsav-2025 "npm run seed && npm test -- --exclude src/__tests__/adminSdkConnection.test.ts --exclude src/__tests__/firebaseInit.test.ts"
      - name: Production dependency audit
        run: npm audit --omit=dev
      - name: Production build
        run: npm run build
      - name: Commit verified remediation and remove temporary workflow
        run: |
          rm -f .github/workflows/one-time-preview-remediation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: resolve preview dependency and portal issues"
          git push origin HEAD:refs/heads/integration/main-participant-remediation
