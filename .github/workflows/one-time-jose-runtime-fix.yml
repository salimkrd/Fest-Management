name: One-time jose runtime compatibility verification
on:
  push:
    branches:
      - integration/main-participant-remediation
    paths:
      - package.json
permissions:
  contents: write
jobs:
  verify-runtime-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: integration/main-participant-remediation
          token: ${{ github.token }}
      - name: Configure Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Configure Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Regenerate dependency lockfile
        run: npm install
      - name: Clean install
        run: npm ci
      - name: Verify CommonJS Firebase Admin Auth runtime import
        run: node -e "require('firebase-admin/auth'); console.log('FIREBASE_ADMIN_AUTH_RUNTIME_OK')"
      - name: TypeScript and lint
        run: |
          npx tsc --noEmit
          npm run lint
      - name: Seeded emulator regression tests
        run: |
          npx firebase emulators:exec --only auth,firestore,storage --project demo-sahithyolsav-2025 "npm run seed && npm test -- --exclude src/__tests__/adminSdkConnection.test.ts --exclude src/__tests__/firebaseInit.test.ts"
      - name: Production dependency audit
        run: npm audit --omit=dev
      - name: Production build
        run: npm run build
      - name: Commit verified lockfile and clean up workflow
        run: |
          rm -f .github/workflows/one-time-jose-runtime-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(runtime): pin CJS jose for Firebase Admin Auth"
          git push origin HEAD:refs/heads/integration/main-participant-remediation
